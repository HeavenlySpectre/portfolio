<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Kevin Anugerah Faza</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#1f1f1f" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { background: #1f1f1f; color: #f2f2f0; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-content: center; text-align: center; padding: 24px; font-family: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    .code { font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(242, 242, 240, 0.5); }
    h1 { margin: 12px 0 0; font-weight: 500; font-size: clamp(96px, 26vw, 320px); letter-spacing: -0.06em; line-height: 0.85; }
    p { margin: 28px 0 0; font-size: clamp(18px, 2.2vw, 28px); letter-spacing: -0.03em; color: rgba(242, 242, 240, 0.55); }
    a { display: inline-block; margin-top: 36px; padding: 16px 28px; border-radius: 999px; background: #f2f2f0; color: #1f1f1f; font-weight: 500; font-size: 15px; text-decoration: none; transition: opacity 0.3s; }
    a:hover, a:focus-visible { opacity: 0.85; outline: none; }
    a:focus-visible { box-shadow: 0 0 0 3px #1f1f1f, 0 0 0 5px #f2f2f0; }
    .dot { display: inline-block; width: 7px; height: 7px; margin-right: 8px; border-radius: 50%; background: #ff5a1f; vertical-align: 1px; }
  </style>
</head>
<body>
  <main>
    <div class="code"><span class="dot"></span>Error 404</div>
    <h1>404</h1>
    <p>This page didn't converge.</p>
    <a href="/">Back to the homepage</a>
  </main>
</body>
</html>
